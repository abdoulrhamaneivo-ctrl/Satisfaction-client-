services:
  - type: web
    name: yeba-server
    runtime: docker
    dockerfilePath: Dockerfile.render
    dockerContext: .
    plan: starter
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: WASP_WEB_CLIENT_URL
        value: https://yeba-server.onrender.com
      # Variables sensibles (à définir dans le dashboard Render après création) :
      # - DATABASE_URL (depuis Neon)
      # - JWT_SECRET
      # - OPENROUTER_API_KEY
      # - SENDGRID_API_KEY
      # - TWILIO_ACCOUNT_SID
      # - TWILIO_AUTH_TOKEN
      # - TWILIO_FROM_NUMBER
      # - AWS_S3_* (si uploads fichiers)

# Base de données gérée séparément via Neon (projet divine-scene-45812034, branche production)
# Pas de service PostgreSQL Render nécessaire.