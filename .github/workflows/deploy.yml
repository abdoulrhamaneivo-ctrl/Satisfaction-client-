name: Wasp Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_PROJECT_NAME: cxsat-poste-ci
      RAILWAY_PROJECT_ID: aa94d855-a4a9-46d5-a2ac-d7fb35cdfb55
      RAILWAY_ENVIRONMENT_ID: 64f204d4-01e7-4000-b8c9-186cff74baa2

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wasp CLI
        run: |
          curl -sSLf https://raw.githubusercontent.com/waspc/wasp/main/waspc/deploy/get.wasp.sh | bash
          WASPLOC=$(find $HOME -name "wasp" -type f -executable 2>/dev/null | head -n 1)
          echo "Wasp executable located at: $WASPLOC"
          if [ -n "$WASPLOC" ]; then
            sudo ln -sf "$WASPLOC" /usr/local/bin/wasp
          fi
          wasp --version

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install project dependencies
        run: wasp install

      - name: Deploy to Railway
        run: wasp deploy railway deploy $RAILWAY_PROJECT_NAME --existing-project-id $RAILWAY_PROJECT_ID
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}